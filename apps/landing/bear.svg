<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- rounded dark background -->
  <rect width="128" height="128" rx="28" fill="#2a201a"/>

  <!-- scale bear (100x100 viewBox) to fit inside 128x128 with 14px padding each side -->
  <g transform="translate(14, 14) scale(1)">
    <!-- arms -->
    <ellipse cx="22" cy="68" rx="10" ry="12" fill="#9A6230"/>
    <ellipse cx="78" cy="68" rx="10" ry="12" fill="#9A6230"/>
    <!-- ears dark -->
    <circle cx="27" cy="26" r="13" fill="#9A6230"/>
    <circle cx="73" cy="26" r="13" fill="#9A6230"/>
    <!-- ears inner -->
    <circle cx="27" cy="26" r="6.2" fill="#F6E2C4"/>
    <circle cx="73" cy="26" r="6.2" fill="#F6E2C4"/>
    <!-- body -->
    <ellipse cx="50" cy="74" rx="29" ry="24" fill="#B97C43"/>
    <!-- belly -->
    <circle cx="50" cy="76" r="16.5" fill="#F6E2C4"/>
    <!-- play ring + triangle -->
    <circle cx="50" cy="76" r="11.5" fill="none" stroke="#5E3C1E" stroke-opacity=".18" stroke-width="2"/>
    <path d="M45.5 68.5 L45.5 83.5 L58.5 76 Z" fill="#5E3C1E"/>
    <!-- head -->
    <circle cx="50" cy="40" r="25" fill="#B97C43"/>
    <!-- muzzle -->
    <ellipse cx="50" cy="47" rx="11" ry="8.5" fill="#F6E2C4"/>
    <!-- eyes -->
    <circle cx="41.5" cy="37" r="2.9" fill="#3A2412"/>
    <circle cx="58.5" cy="37" r="2.9" fill="#3A2412"/>
    <!-- eye shine -->
    <circle cx="42.4" cy="36" r="0.9" fill="#fff"/>
    <circle cx="59.4" cy="36" r="0.9" fill="#fff"/>
    <!-- nose -->
    <ellipse cx="50" cy="43.5" rx="3.1" ry="2.4" fill="#3A2412"/>
    <!-- mouth -->
    <path d="M50 46 L50 49 M50 49 C47.5 50.6 45.6 49.3 45.2 47.8 M50 49 C52.5 50.6 54.4 49.3 54.8 47.8"
          stroke="#3A2412" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
