name: Release extension

# push a tag like v0.1.0 to cut a release; the manual run just builds the zip
# as an artifact so you can grab it without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build:ext

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_OUTPUT"

      # Chrome wants the manifest at the zip root, so zip the dist contents, not the folder
      - name: Zip
        run: |
          cd apps/extension/dist
          zip -r "$GITHUB_WORKSPACE/watchbear-extension-v${{ steps.ver.outputs.version }}.zip" .

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: watchbear-extension-v${{ steps.ver.outputs.version }}
          path: watchbear-extension-v${{ steps.ver.outputs.version }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: watchbear-extension-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
