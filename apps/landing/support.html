  <head>
    <meta charset="utf-8" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Watchbear" />
    <meta property="og:title" content="Watchbear Support" />
    <meta

      content="Questions, bugs, or feedback? Reach the Watchbear team and we'll help you out."
    />
    <meta property="og:url" content="https://watchbear.deepfeld.com/support.html" />

    <meta property="og:image" content="https://watchbear.deepfeld.com/og.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Watchbear Support" />
    <meta
      name="twitter:description"
      content="Questions, bugs, or feedback? Reach the Watchbear team and we'll help you out."
    />
    <meta name="twitter:image" content="https://watchbear.deepfeld.com/og.png" />
    <meta name="twitter:image:alt" content="Watchbear, watch videos together in perfect sync" />

    <link rel="icon" type="image/svg+xml" href="bear.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icon16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="nav.js" defer></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": "https://watchbear.deepfeld.com/support.html#webpage",
            "url": "https://watchbear.deepfeld.com/support.html",
            "name": "Watchbear Support · Get Help & Contact Us",
            "description": "Need help with Watchbear? Questions, bug reports, or feedback - send us a message and we'll get back to you.",
            "inLanguage": "en",
            "isPartOf": { "@id": "https://watchbear.deepfeld.com/#website" },
            "publisher": { "@id": "https://watchbear.deepfeld.com/#org" }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://watchbear.deepfeld.com/support.html#breadcrumb",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://watchbear.deepfeld.com/" },
              { "@type": "ListItem", "position": 2, "name": "Support", "item": "https://watchbear.deepfeld.com/support.html" }
            ]
          }
        ]
      }
    </script>
    <style>
      /* page-specific styles; shared tokens and primitives live in styles.css */
      body {
        font-size: 17px;
        overflow-x: hidden;
      }
      .wrap {
        max-width: 760px;
      }

      /* hero */
      .hero {
        text-align: center;
        padding: 72px 0 12px;
      }
      .hero h1 {
        font-size: 42px;
      }
      .hero h1 .accent {
        color: var(--accent-text);
      }
      .hero p {
        color: var(--muted);
        font-weight: 400;
        font-size: 16px;
        max-width: 520px;
        margin: 18px auto 0;
      }

      /* contact form */
      .contact {
        padding: 40px 0 72px;
      }
      .form-box {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: 30px 28px;
        box-shadow: var(--shadow-sm);
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
        margin-bottom: 7px;
      }
      .field input,
      .field textarea {
        width: 100%;
        padding: 12px 14px;
        font-family: var(--font-body);
        font-size: 15px;
        font-weight: 400;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-input);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .field input::placeholder,
      .field textarea::placeholder {
        color: var(--faint);
        font-weight: 400;
      }
      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-tint);
      }
      .field textarea {
        resize: vertical;
        min-height: 150px;
        line-height: 1.5;
      }
      .form-foot {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .form-foot .alt {
        color: var(--muted);
        font-weight: 400;
        font-size: 14px;
      }
      .form-foot .alt a {
        color: var(--accent-text);
        font-weight: 700;
      }
      .form-foot .alt a:hover {
        text-decoration: underline;
      }

      /* footer */
      .foot {
        border-top: 1px solid var(--line);
        background: none;
        max-width: 760px;
        padding: 30px 28px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
      }
      .foot .tag {
        color: var(--faint);
        font-weight: 500;
        font-size: 13.5px;
      }
      .foot a {
        color: var(--muted);
        font-weight: 600;
        font-size: 13.5px;
      }
      .foot a:hover {
        color: var(--ink);
      }

      @media (max-width: 640px) {
        .hero h1 {
          font-size: 32px;
        }
        .form-box {
          padding: 24px 20px;
        }
      }
    </style>
  </head>
  <body>
    <wb-nav></wb-nav>

    <main>
      <header class="hero">
        <div class="wrap">
          <h1>Get <span class="accent">support</span></h1>
          <p>Questions, a bug to report, or just some feedback? Drop us a message and we'll get back to you.</p>
        </div>
      </header>

      <section class="contact">
        <div class="wrap">
          <div class="form-box">
            <form id="support-form" autocomplete="on">
              <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required />
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />
              </div>
              <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Describe your question or issue" required></textarea>
              </div>
              <div class="form-foot">
                <button type="submit" class="btn">Send message</button>
                <span class="alt">
                  or email us directly at
                  <a href="mailto:watchbear@deepfeld.com">watchbear@deepfeld.com</a>
                </span>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="wrap foot">
      <span class="tag">Watchbear · watch videos together, in sync</span>
      <a href="index.html">Back home</a>
    </footer>

    <script>
      // no backend on the landing site: build a mailto draft from the fields and hand off
      // to the visitor's mail client. the visible address above is the fallback.
      (function () {
        var form = document.getElementById("support-form");
        if (!form) return;
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var name = document.getElementById("name").value.trim();
          var email = document.getElementById("email").value.trim();
          var message = document.getElementById("message").value.trim();
          var subject = encodeURIComponent("Watchbear support - " + name);
          var body = encodeURIComponent(message + "\n\n- " + name + " (" + email + ")");
          window.location.href = "mailto:watchbear@deepfeld.com?subject=" + subject + "&body=" + body;
        });
      })();
    </script>
  </body>
</html>
