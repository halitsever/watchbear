<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Watchbear, the sweet way to watch together">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c140e" />
      <stop offset="1" stop-color="#120d08" />
    </linearGradient>
    <radialGradient id="h" cx="36%" cy="28%" r="82%">
      <stop offset="0" stop-color="#DC9E60" />
      <stop offset="1" stop-color="#BC7E40" />
    </radialGradient>
    <radialGradient id="e" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#C98A4B" />
      <stop offset="1" stop-color="#AB7037" />
    </radialGradient>
    <radialGradient id="glow" cx="28%" cy="34%" r="60%">
      <stop offset="0" stop-color="rgba(255,178,62,0.16)" />
      <stop offset="1" stop-color="rgba(255,178,62,0)" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="20" y="20" width="1160" height="590" rx="28" fill="none" stroke="rgba(255,220,180,0.1)" stroke-width="2" />

  <!-- bear face -->
  <g transform="translate(120,135) scale(3.6)">
    <circle cx="23" cy="27" r="16" fill="url(#e)" />
    <circle cx="77" cy="27" r="16" fill="url(#e)" />
    <circle cx="23" cy="27" r="7.5" fill="#F6E2C4" />
    <circle cx="77" cy="27" r="7.5" fill="#F6E2C4" />
    <circle cx="50" cy="52" r="35" fill="url(#h)" />
    <ellipse cx="49" cy="34" rx="15" ry="10" fill="#fff" opacity="0.12" />
    <ellipse cx="27" cy="60" rx="8" ry="6" fill="#FF9E7A" opacity="0.9" />
    <ellipse cx="73" cy="60" rx="8" ry="6" fill="#FF9E7A" opacity="0.9" />
    <ellipse cx="50" cy="64" rx="18" ry="14" fill="#FBEAD2" />
    <circle cx="37" cy="47" r="5" fill="#3A2412" />
    <circle cx="63" cy="47" r="5" fill="#3A2412" />
    <circle cx="38.8" cy="45" r="1.7" fill="#fff" />
    <circle cx="64.8" cy="45" r="1.7" fill="#fff" />
    <ellipse cx="50" cy="58" rx="5.2" ry="4.2" fill="#3A2412" />
    <path d="M50 62 L50 67 M50 67 C45.5 69.5 42 67 41.2 64 M50 67 C54.5 69.5 58 67 58.8 64" stroke="#3A2412" stroke-width="2.4" stroke-linecap="round" fill="none" />
  </g>

  <!-- text -->
  <g font-family="'Fredoka','Nunito',Verdana,sans-serif">
    <text x="560" y="345" font-size="92" font-weight="700" letter-spacing="-2">
      <tspan fill="#f6ebdc">Watch</tspan><tspan fill="#ffb23e">bear</tspan>
    </text>
  </g>
</svg>
