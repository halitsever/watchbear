          },

            ]
          }
        ]

    <style>
      :root {
        --bg: #14100b;
        --panel: #1c150e;
        --panel2: #241a11;
        --line: rgba(244, 196, 128, 0.12);
        --honey: #f0a830;
        --honey-bright: #ffc560;
        --coral: #e58a6e;
        --honey-deep: #f0a830;
        --on-honey: #241704;
        --cream: #fbf2e3;
        --text: #f6ead7;
        --dim: #c9b095;
        --faint: #93795f;
        --online: #6ac987;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Hanken Grotesk", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
        font-size: 17px;
        overflow-x: hidden;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 28px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2 {
        font-family: "Baloo 2";
        font-weight: 600;
        letter-spacing: -0.5px;
        margin: 0;
        line-height: 1.06;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: "Hanken Grotesk";
        font-weight: 700;
        cursor: pointer;
        border: none;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--honey-bright), var(--honey));
        color: var(--on-honey);
        box-shadow: 0 6px 18px rgba(240, 168, 48, 0.3);
        transition:
          transform 0.15s,
          box-shadow 0.2s;
        padding: 12px 22px;
        font-size: 15px;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(240, 168, 48, 0.42);
      }

      /* hero */
      .hero {
        text-align: center;
        padding: 72px 0 12px;
      }
      .hero h1 {
        font-size: 46px;
      }
      .hero h1 .accent {
        color: var(--honey);
      }
      .hero p {
        color: var(--dim);
        font-weight: 600;
        font-size: 16px;
        max-width: 520px;
        margin: 18px auto 0;
      }

      /* contact form */
      .contact {
        padding: 40px 0 72px;
      }
      .form-box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 30px 28px;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        color: var(--text);
        margin-bottom: 7px;
      }
      .field input,
      .field textarea {
        width: 100%;
        padding: 12px 14px;
        font-family: "Hanken Grotesk", system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 11px;
        transition: border-color 0.2s;
      }
      .field input::placeholder,
      .field textarea::placeholder {
        color: var(--faint);
        font-weight: 600;
      }
      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--honey);
      }
      .field textarea {
        resize: vertical;
        min-height: 150px;
        line-height: 1.5;
      }
      .form-foot {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .form-foot .alt {
        color: var(--dim);
        font-weight: 600;
        font-size: 14px;
      }
      .form-foot .alt a {
        color: var(--honey);
        font-weight: 800;
      }
      .form-foot .alt a:hover {
        text-decoration: underline;
      }

      /* footer */
      .foot {
        border-top: 1px solid var(--line);
        padding: 30px 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
      }
      .foot .tag {
        color: var(--faint);
        font-weight: 700;
        font-size: 13.5px;
      }
      .foot a {
        color: var(--dim);
        font-weight: 700;
        font-size: 13.5px;
      }
      .foot a:hover {
        color: var(--honey);
      }

      @media (max-width: 640px) {
        .hero h1 {
          font-size: 34px;
        }
        .form-box {
          padding: 24px 20px;
        }
      }
    </style>
  </head>
  <body>
    <wb-nav></wb-nav>

    <main>
      <header class="hero">
        <div class="wrap">
          <h1>Get <span class="accent">support</span></h1>
          <p>Questions, a bug to report, or just some feedback? Drop us a message and we'll get back to you.</p>
        </div>
      </header>

      <section class="contact">
        <div class="wrap">
          <div class="form-box">
            <form id="support-form" autocomplete="on">
              <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required />
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />
              </div>
              <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell us what's on your mind…" required></textarea>
              </div>
              <div class="form-foot">
                <button type="submit" class="btn">Send message</button>
                <span class="alt">
                  or email us directly at
                  <a href="mailto:watchbear@deepfeld.com">watchbear@deepfeld.com</a>
                </span>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="wrap foot">
      <span class="tag">Watchbear · the sweet way to watch together</span>
      <a href="index.html">Back home</a>
    </footer>

    <script>
      // no backend on the landing site: build a mailto draft from the fields and hand off
      // to the visitor's mail client. the visible address above is the fallback.
      (function () {
        var form = document.getElementById("support-form");
        if (!form) return;
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var name = document.getElementById("name").value.trim();
          var email = document.getElementById("email").value.trim();
          var message = document.getElementById("message").value.trim();
          var subject = encodeURIComponent("Watchbear support - " + name);
          var body = encodeURIComponent(message + "\n\n- " + name + " (" + email + ")");
          window.location.href = "mailto:watchbear@deepfeld.com?subject=" + subject + "&body=" + body;
        });
      })();
    </script>
  </body>
</html>
