# Released extensions only recognise invites on this host, so it keeps the join page and its assets.
server {
  listen 80;
  server_name watchbear.deepfeld.com;
  root /usr/share/nginx/html;

  location = /j {
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /j.html =404;
  }

  location = /j.html {
    add_header X-Robots-Tag "noindex, nofollow";
  }

  location ~* \.(css|js|mjs|png|jpe?g|webp|avif|gif|svg|ico|woff2?|json|webmanifest|mp4|webm|vtt)$ {
    try_files $uri =404;
  }

  location / {
    return 301 https://watchbear.net$request_uri;
  }
}

server {
  listen 80;
  server_name www.watchbear.net;
  return 301 https://watchbear.net$request_uri;
}

server {
  listen 80 default_server;
  root /usr/share/nginx/html;

  # TLS ends at the proxy, so an absolute Location would point at http.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # File names carry no content hash, so pages and styles stay fresh for returning visitors.
  add_header Cache-Control "public, max-age=600";

  location ~* \.(png|jpe?g|webp|avif|gif|ico|woff2?|mp4|webm)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # /support and /j answer without the .html suffix, the links the extension ships with.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
